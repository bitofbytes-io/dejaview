<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DejaView sign in, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="late-show-tokens.css">
<link rel="stylesheet" href="ds/dejaview/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500..800&family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0a12;font-family:"Archivo",system-ui,sans-serif;color:#f3eff7}
a{color:#4de3f5}a:hover{color:#f3eff7}
</style>
</helmet>
<div class="dv-page dv-grain dv-crt tape-{{wear}}" style="width: 390px; height: 844px; overflow: hidden; background: var(--screen); display: flex; flex-direction: column; justify-content: center; padding: 16px; box-sizing: border-box;">
  <form class="login-card" style="padding: 32px 24px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width: 48px; height: 48px; color: var(--neon-rose);" aria-hidden="true"><rect x="2.5" y="9" width="19" height="11" rx="1"></rect><path d="M2.5 9 L21.5 4.5 L21.5 9 Z"></path><line x1="6" y1="5.5" x2="6" y2="9"></line><line x1="9" y1="6" x2="9" y2="9"></line><line x1="12" y1="6.5" x2="12" y2="9"></line><line x1="15" y1="7" x2="15" y2="9"></line><line x1="18" y1="7.5" x2="18" y2="9"></line></svg>
      <p class="osd osd-lg osd-rose" style="margin: 16px 0 0;"><span class="osd-blink">▶</span> Press play</p>
      <h1 class="rgb-split" style="margin: 8px 0 0; font-family: var(--font-display); font-size: 30px; line-height: 34px; font-weight: 800;">Deja<span style="color: var(--neon-rose);">View</span></h1>
      <p style="margin: 8px 0 0; color: var(--ink-muted);">Family movie night tracker</p>
    </div>
    <label class="field-label" for="tok">Access token</label>
    <input id="tok" class="input-field" type="password" autocomplete="current-password" placeholder="Enter your token">
    <button class="btn-primary" type="submit" style="width: 100%; margin-top: 16px;">Sign in</button>
    <hr class="divider" style="margin: 32px 0 16px;">
    <p class="osd osd-dim" style="margin: 0; text-align: center;">SP 0:00:00 · Be kind, rewind</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tapeWear":{"editor":"enum","options":["clean","worn","rewound"],"default":"worn","section":"Tape"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { wear: this.props.tapeWear ?? 'worn' }; }
}
</script>
</body>
</html>
